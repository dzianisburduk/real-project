name: Run Tests

on:
  push:
    branches: [ practika ]
  pull_request:
    branches: [ practika ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 'latest'

      - name: Run echo test
        run: echo "Запускаем тесты"

      - name: Install dependencies and run npm test
        run: |
          npm install
          npm test