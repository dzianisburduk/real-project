stages: 
  - build 
  - test
  - deploy

#--------ЭТАП СБОРКИ------- 
build_docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
    - dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker compose build
    - docker compose push

#-------ЭТАП ТЕСТИРОВАНИЯ-----

test_job:
  stage: test
  image: python:3.10-slim
  cache:
    key: pip-cache
    paths:
      - .pip-cache/
  tags:
    - docker
    - dind
  script:
  - pip install requirements.txt --cache-dir .pip-cache/
  - flake8 .

#------ЭТАП ДЕПЛОЯ------
deploy_job:
  stage: deploy
  environment:
    name: dev
  rules: 
    - if: $CI_COMMIT_BRANCH == "develop"
  tags:
    - docker
    - dind
  script: 
  - echo "Деплой на DEV выполнен! Контейнеры docker compose перезапущены."

deploy_staging:                 # Добавили окружение staging из ТЗ
  stage: deploy
  environment:
    name: staging
  rules: 
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - docker
    - dind
  script: 
    - echo "Деплой на STAGING выполнен!"

deploy_to_prod:
  stage: deploy
  environment:
    name: production 
  rules: 
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - docker
    - dind
  script:
  - echo "Ручной деплой на PRODUCTION подтвержден и выполнен!"
  when: manual  