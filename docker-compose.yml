services:
  database:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: app_database
    volumes:
      - phase_database:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_NAME: app_database
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword      
    depends_on:
      - database
  backend-1:
    build: ./backend
    ports:
      - "8001:5000"
  backend-2:
    build: ./backend
    ports:
      - "8002:5000"
  backend-3:
    build: ./backend
    ports:
      - "8003:5000"
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:mysecretpassword@database:5432/app_database?sslmode=disable
    ports:
     - "9187:9187"
    depends_on:
      - database

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: local_prometheus
    volumes: 
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - postgres_exporter

  nginx:
    image: nginx:1.25-alpine
    container_name: local_nginx
    ports:
    - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Команда раз в 12 часов проверяет, не пора ли обновить сертификаты
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  phase_database: