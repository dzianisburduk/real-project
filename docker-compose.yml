services:
  database:
    image: postgres:15-alpine
    container_name: local_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - phase_database:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}      
    depends_on:
      - database
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_USER}://postgres:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    ports:
     - "9187:9187"
    depends_on:
      - database

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: local_prometheus
    volumes: 
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./prometheus/grafana_token:/etc/prometheus/grafana_token
    ports:
      - "9090:9090"
    depends_on:
      - postgres_exporter

  nginx:
    image: nginx:1.25-alpine
    container_name: local_nginx
    ports:
      - "80:80"
    command: nginx -g "daemon off;"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.0
    container_name: nginx_exporter
    ports:
      - "9113:9113"
    depends_on:
      - nginx
volumes:
  phase_database: