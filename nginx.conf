events{}

http 
{
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  
  upstream backend_clusters
  {
    least_conn;
    server 127.0.0.1:8001 weight=3 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 weight=2 max_fails=2 fail_timeout=20s;
    server 127.0.0.1:8003 weight=1 max_fails=1 fail_timeout=5s;
  }
  server
  {
        listen 80;
        server_name old-site.ru www.old-site.ru main_app.com;
        location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        }
        location / {
        return 301 https://main_app.com$request_uri;
     }
  }
   server 
  {
    listen 80 default_server;
    return 444;
  }
  server 
  {
    listen 80 ;
    server_name   localhost main_app.com;
    location / 
    {
        root /usr/share/nginx/html;
        index index.html;
    }
    location ~* \.(jpg|png)$
    {
    root /usr/share/nginx/html; # Тот же путь к статике
    expires 30d;                # Кэшировать в браузере на 30 дней
    access_log off;             # Отключаем логи для картинок, ч
    }
    location /api 
    {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server
  {
    listen 8001;
    server_name fisrt_server;
    location /
    {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
  server
  {
    listen 8002;
    server_name fisrt_server;
    location /
    {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
  server
  {
    listen 8003;
    server_name fisrt_server;
    location /
    {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}