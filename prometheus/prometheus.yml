global:
  scrape_interval: 5s # собирать метрики каждые 5 секунд

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187'] # адрес, откуда забирать метрики базы

# Секция отправки в облако Grafana Cloud
remote_write:
  - url: 'https://prometheus-prod-39-prod-eu-north-0.grafana.net/api/prom/push'
    basic_auth:
      username: '3372164'
      password: 'GRAFANA_CLOUD_TOKEN_PLACEHOLDER'